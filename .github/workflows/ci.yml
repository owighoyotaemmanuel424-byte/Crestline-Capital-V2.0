name: CI

on:
  push:
    branches: [main, 'production/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: crestline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build and validate Convex + Next.js
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CONVEX_DEPLOY_KEY: ${{ github.event_name == 'pull_request' && secrets.CONVEX_PREVIEW_DEPLOY_KEY || secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --cmd 'npm run build' --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL

      - name: Explain fork PR limitation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo 'Fork PR detected; Convex preview deploy is skipped because GitHub does not expose repository secrets to forked pull requests.'
